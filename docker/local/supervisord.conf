[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Nginx process
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
priority=999
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log

# Frontend dev server
[program:frontend]
directory=/workspace/listpkgs.nuros.front-end
command=pnpm dev --host 0.0.0.0 --port 5173
autostart=true
autorestart=true
startsecs=10
priority=998
environment=NODE_ENV=development
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend.error.log

# Documentation dev server
[program:docs]
directory=/workspace/blog
command=pnpm docs:dev --host 0.0.0.0 --port 5174
autostart=true
autorestart=true
startsecs=10
priority=997
environment=NODE_ENV=development
stdout_logfile=/var/log/docs.log
stderr_logfile=/var/log/docs.error.log
