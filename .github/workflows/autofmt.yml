# =============================================================================
# Auto Format Workflow
# =============================================================================
# Automatically formats Python and frontend code.
# Runs on push and PR.
# Commits changes back to the repository/PR branch.
#
# Triggered by:
# - Push to any branch
# - Pull request (formats code in PR branch)
# - Manual dispatch
#
# Formats:
# - Python (.ci/): black + isort
# - Frontend (listpkgs.nuros.front-end/): prettier (TS/TSX/SCSS/CSS)
# =============================================================================

name: Auto Format

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofmt-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------------------
  # Job: Format Code
  # -------------------------------------------------------------------------
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check if commit is from bot
        id: bot-check
        run: |
          if [ "${{ github.event.head_commit.author.username }}" = "github-actions" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping format - commit from github-actions[bot]"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.bot-check.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # For PRs, checkout the PR branch head
          ref: ${{ github.head_ref || github.ref }}

      - name: Determine run context
        if: steps.bot-check.outputs.skip != 'true'
        id: context
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "context=pr" >> "$GITHUB_OUTPUT"
            echo "📝 Running in PR context: #${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "context=push" >> "$GITHUB_OUTPUT"
            echo "📝 Running in push context: ${{ github.ref_name }}"
          else
            echo "context=manual" >> "$GITHUB_OUTPUT"
            echo "🔧 Running in manual dispatch context"
          fi

      - name: Install Podman and dependencies
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              podman-docker \
              pigz \
              slirp4netns \
              python3-pip

          # Обновляем podman-compose до версии с поддержкой профилей
          pip install --break-system-packages 'podman-compose>=1.1.0'

          echo "✅ Podman: $(podman --version)"
          echo "✅ podman-compose: $(podman-compose --version)"

      - name: Run formatter via podman-compose
        if: steps.bot-check.outputs.skip != 'true'
        id: format
        run: |
          # Run formatter service using podman-compose
          podman-compose --profile development run --rm format

      - name: Check for changes
        if: steps.bot-check.outputs.skip != 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No changes to commit - workflow will complete with success status"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Changes detected - will commit"
          fi

      - name: Configure Git
        if: steps.bot-check.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit changes
        if: steps.bot-check.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Determine branch to push to
          if [ "${{ steps.context.outputs.context }}" = "pr" ]; then
            echo "📝 PR context - pushing to PR branch"
            git add -A
            git commit -m "chore(format): auto-format code [bot]" || exit 0
            git push origin HEAD
          elif [ "${{ steps.context.outputs.context }}" = "push" ]; then
            echo "📝 Push context - pushing to ${{ github.ref_name }}"
            git add -A
            git commit -m "chore(format): auto-format code [bot]" || exit 0
            git push origin HEAD
          else
            echo "📝 Schedule/manual context - pushing to ${{ github.ref_name }}"
            git add -A
            git commit -m "chore(format): auto-format code [bot]" || exit 0
            git push origin HEAD
          fi

      - name: Create format summary
        if: always()
        run: |
          SKIPPED="${{ steps.bot-check.outputs.skip }}"
          CHANGED="${{ steps.changes.outputs.changed }}"
          CONTEXT="${{ steps.context.outputs.context }}"

          if [ "$SKIPPED" = "true" ]; then
            STATUS="⏭️ Skipped (bot commit)"
            ACTION="Format workflow skipped - commit from github-actions[bot]"
            CONTEXT_TEXT="N/A"
          elif [ "$CHANGED" = "true" ]; then
            STATUS="📝 Changes committed"
            ACTION="Code has been formatted and committed"
          else
            STATUS="✅ No changes (success)"
            ACTION="Code is already properly formatted"
          fi

          if [ "$SKIPPED" != "true" ]; then
            case "$CONTEXT" in
              pr)
                CONTEXT_TEXT="🔀 Pull Request #${{ github.event.pull_request.number }}"
                ;;
              push)
                CONTEXT_TEXT="📤 Push to \`${{ github.ref_name }}\`"
                ;;
              *)
                CONTEXT_TEXT="🔧 Manual dispatch"
                ;;
            esac
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🎨 Auto Format Results

          | Check | Status |
          |-------|--------|
          | Context | $CONTEXT_TEXT |
          | Format | $STATUS |

          ### Result
          $ACTION

          ### Formatted Directories
          - \`.ci/\` - Python code (black + isort)
          - \`listpkgs.nuros.front-end/\` - Frontend code (prettier)

          ### Tools Used
          - **Python**: black, isort
          - **Frontend**: prettier (TS/TSX/SCSS/CSS)

          ### Workflow Status
          $STATUS - workflow completed successfully
          EOF
