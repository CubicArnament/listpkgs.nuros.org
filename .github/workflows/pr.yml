# =============================================================================
# Pull Request Test Workflow
# =============================================================================
# Comprehensive tests for every Pull Request:
# 1. Security checks (npm audit, dependency review)
# 2. Build verification  
# 3. Playwright tests
#
# Runs ONLY on pull requests (not on push).
# For lint-only checks, see lint.yml.
# All checks run in Podman containers.
# =============================================================================

name: PR Tests

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint Code (ESLint + Stylelint)
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Run ESLint + Stylelint in container
        run: |
          podman-compose --profile ci build --no-cache lint
          podman-compose --profile ci run --rm lint

  # -------------------------------------------------------------------------
  # Job 2: Security Checks
  # -------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./listpkgs.nuros.front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: listpkgs.nuros.front-end/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # -------------------------------------------------------------------------
  # Job 2: Build Verification
  # -------------------------------------------------------------------------
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Build frontend in container
        run: |
          podman-compose --profile ci build --no-cache build
          podman-compose --profile ci create build
          podman-compose --profile ci cp build:/app/listpkgs.nuros.front-end/dist/ listpkgs.nuros.front-end/dist/
          podman-compose --profile ci rm -f build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-build
          path: listpkgs.nuros.front-end/dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Job 3: Playwright Tests
  # -------------------------------------------------------------------------
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Run Playwright tests in container
        run: |
          podman-compose --profile ci build --no-cache test
          podman-compose --profile ci run --rm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: listpkgs.nuros.front-end/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 4: PR Summary
  # -------------------------------------------------------------------------
  pr-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, security, build-verify, playwright-tests]
    if: always()

    steps:
      - name: Create PR summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🧪 Pull Request Test Results

          | Check | Status |
          |-------|--------|
          | 🔍 Lint | ${{ needs.lint.result }} |
          | 🔒 Security | ${{ needs.security.result }} |
          | 🏗️ Build | ${{ needs.build-verify.result }} |
          | 🧪 Playwright | ${{ needs.playwright-tests.result }} |

          **Overall**: ${{ needs.playwright-tests.result }}
          EOF

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const result = {
              lint: '${{ needs.lint.result }}',
              security: '${{ needs.security.result }}',
              build: '${{ needs.build-verify.result }}',
              tests: '${{ needs.playwright-tests.result }}'
            };
            const allPassed = Object.values(result).every(r => r === 'success');
            const body = [
              `## ${allPassed ? '✅' : '⚠️'} PR Test Results`,
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| 🔍 Lint | ${result.lint} |`,
              `| 🔒 Security | ${result.security} |`,
              `| 🏗️ Build | ${result.build} |`,
              `| 🧪 Tests | ${result.tests} |`,
              '',
              allPassed ? '**All checks passed!** ✅' : '**Some checks failed.** See logs.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
