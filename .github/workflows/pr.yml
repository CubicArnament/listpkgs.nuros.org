# =============================================================================
# Pull Request Test Workflow
# =============================================================================
# Comprehensive tests for every Pull Request:
# 1. Security checks (npm audit, dependency review)
# 2. Build verification
# 3. Playwright tests
#
# Works in pair with lint.yml (which runs ESLint + Stylelint).
# All checks run in Docker containers.
# =============================================================================

name: Pull Request Tests

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Security Checks
  # -------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./listpkgs.nuros.front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: listpkgs.nuros.front-end/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # -------------------------------------------------------------------------
  # Job 2: Build Verification
  # -------------------------------------------------------------------------
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker (Podman compatibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              podman-docker || true

      - name: Detect Container Runtime
        id: runtime
        run: |
          if command -v docker &> /dev/null; then
            echo "compose=docker compose" >> $GITHUB_OUTPUT
          elif command -v podman &> /dev/null; then
            echo "compose=podman-compose" >> $GITHUB_OUTPUT
          else
            echo "❌ No container runtime available"
            exit 1
          fi

      - name: Build frontend in container
        run: |
          ${{ steps.runtime.outputs.compose }} --profile ci run --rm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-build
          path: listpkgs.nuros.front-end/dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Job 3: Playwright Tests
  # -------------------------------------------------------------------------
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker (Podman compatibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              podman-docker || true

      - name: Detect Container Runtime
        id: runtime
        run: |
          if command -v docker &> /dev/null; then
            echo "compose=docker compose" >> $GITHUB_OUTPUT
          elif command -v podman &> /dev/null; then
            echo "compose=podman-compose" >> $GITHUB_OUTPUT
          else
            echo "❌ No container runtime available"
            exit 1
          fi

      - name: Run Playwright tests in container
        run: |
          ${{ steps.runtime.outputs.compose }} --profile ci run --rm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: listpkgs.nuros.front-end/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 4: PR Summary
  # -------------------------------------------------------------------------
  pr-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security, build-verify, playwright-tests]
    if: always()

    steps:
      - name: Create PR summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🧪 Pull Request Test Results

          | Check | Status |
          |-------|--------|
          | 🔍 Lint (lint.yml) | Triggered separately |
          | 🔒 Security | ${{ needs.security.result }} |
          | 🏗️ Build | ${{ needs.build-verify.result }} |
          | 🧪 Playwright | ${{ needs.playwright-tests.result }} |

          **Overall**: ${{ needs.playwright-tests.result }}
          EOF

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const result = {
              lint: 'Triggered separately (lint.yml)',
              security: '${{ needs.security.result }}',
              build: '${{ needs.build-verify.result }}',
              tests: '${{ needs.playwright-tests.result }}'
            };
            const allPassed = Object.values(result).every(r => r === 'success' || r.includes('separately'));
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${allPassed ? '✅' : '⚠️'} PR Test Results

          | Check | Status |
          |-------|--------|
          | 🔍 Lint | ${result.lint} |
          | 🔒 Security | ${result.security} |
          | 🏗️ Build | ${result.build} |
          | 🧪 Tests | ${result.tests} |

          ${allPassed ? '**All checks passed!** ✅' : '**Some checks failed.** See logs.'}
          `
            });
