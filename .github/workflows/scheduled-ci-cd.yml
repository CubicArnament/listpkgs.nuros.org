# =============================================================================
# Scheduled CI/CD Pipeline with Lint Check
# =============================================================================
# This workflow runs every 6 hours and:
# 1. Checks that lint.yml passed successfully
# 2. Runs the main CI/CD pipeline (update-list -> build -> test -> deploy)
#
# Triggered by:
# - Schedule (every 6 hours)
#
# Note: This workflow depends on lint.yml passing, but does not trigger it.
# The lint.yml workflow should run independently or be triggered manually.
# =============================================================================

name: Scheduled CI/CD (Lint Check)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scheduled-ci-cd
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Check Lint Status
  # Verifies that lint.yml passed successfully before proceeding
  # -------------------------------------------------------------------------
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint-passed: ${{ steps.check.outputs.passed }}

    steps:
      - name: Check lint status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LINT_RESULT=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow "Lint Frontend" \
            -s success \
            --limit 1 \
            --json conclusion \
            -q '.[0].conclusion // "unknown"')

          echo "Latest lint result: $LINT_RESULT"

          if [ "$LINT_RESULT" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ Lint passed"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Lint failed or not run"
          fi

  # -------------------------------------------------------------------------
  # Job 2: Run CI/CD Pipeline
  # -------------------------------------------------------------------------
  run-ci-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check-lint
    if: needs.check-lint.outputs.lint-passed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Container Runtimes + Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              docker.io \
              docker-compose \
              podman \
              podman-docker \
              slirp4netns \
              apparmor \
              apparmor-utils \
              pigz
          
          if docker info &> /dev/null; then
            echo "RUNTIME=docker" >> $GITHUB_ENV
            echo "COMPOSE_CMD=docker compose" >> $GITHUB_ENV
          elif podman info &> /dev/null; then
            echo "RUNTIME=podman" >> $GITHUB_ENV
            echo "COMPOSE_CMD=podman-compose" >> $GITHUB_ENV
          fi

      - name: Run update-list service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm update-list

      - name: Generate package count
        id: generate
        run: |
          if [ -f listpkgs.nuros.front-end/public/repodata.json ]; then
            COUNT=$(jq 'length' listpkgs.nuros.front-end/public/repodata.json 2>/dev/null || echo "0")
            echo "package_count=$COUNT" >> $GITHUB_OUTPUT
            echo "📦 Package count: $COUNT"
          else
            echo "package_count=0" >> $GITHUB_OUTPUT
            echo "⚠️ repodata.json not found"
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet listpkgs.nuros.front-end/public/repodata.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📭 No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📬 Changes detected"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin
          git reset --hard origin/main
          git add listpkgs.nuros.front-end/public/repodata.json
          git add listpkgs.nuros.front-end/public/repodata.json.sha256
          git commit -m "chore: update repodata (${{ steps.generate.outputs.package_count }} packages)" || exit 0
          git push origin main || echo "No changes to push"

      - name: Build frontend
        id: build
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml build build
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm build
          echo "✅ Build completed"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Verify build artifacts
        run: |
          echo "📋 Build contents:"
          ls -lh listpkgs.nuros.front-end/dist/ | head -20

          if [ ! -f "listpkgs.nuros.front-end/dist/index.html" ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi

          if [ ! -f "listpkgs.nuros.front-end/dist/repodata.json" ]; then
            echo "⚠️ WARNING: repodata.json not found in dist/"
            cp listpkgs.nuros.front-end/public/repodata.json listpkgs.nuros.front-end/dist/
          fi

          echo "✅ Build verified"

      - name: Run tests
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml build test
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: listpkgs.nuros.front-end/playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 Scheduled Deployment (Every 6 Hours)

          | Metric | Value |
          |--------|-------|
          | **Status** | ${{ job.status }} |
          | **URL** | ${{ steps.deployment.outputs.page_url }} |
          | **Packages** | ${{ steps.generate.outputs.package_count }} |
          | **Lint Check** | ${{ needs.check-lint.outputs.lint-passed }} |
          | **Triggered by** | Schedule (cron) |
          EOF
