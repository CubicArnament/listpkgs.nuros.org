# =============================================================================
# Lint Frontend Workflow
# =============================================================================
# Runs ESLint and Stylelint on every push and pull request.
# Executes in a lightweight Docker container (lint_frontend.Dockerfile).
# =============================================================================

name: Lint Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker

      - name: Start Podman socket
        run: |
          sudo systemctl start podman.socket 2>/dev/null || \
          (podman system service --time=0 unix:///var/run/docker.sock &)
          sleep 3
          sudo chmod 666 /var/run/docker.sock 2>/dev/null || true

      - name: Run ESLint + Stylelint in container
        run: |
          docker compose --profile ci run --rm lint

      - name: Create lint summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔍 Lint Results

          | Check | Status |
          |-------|--------|
          | ESLint (TypeScript) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Stylelint (SCSS) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |

          **Container**: docker/lint_frontend.Dockerfile
          EOF
