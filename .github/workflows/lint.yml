# =============================================================================
# Lint Frontend Workflow
# =============================================================================
# Runs ESLint and Stylelint on code changes.
# Compatible with both Docker and Podman runtimes.
# =============================================================================

name: Lint Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./listpkgs.nuros.front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Container Runtimes (Docker + Podman) + Security Tools
        run: |
          echo "🔧 Installing container runtimes and security tools..."
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              slirp4netns \
              apparmor \
              apparmor-utils \
              pigz
          
          # podman-docker создаёт симлинки docker→podman
          sudo apt-get install -y podman-docker || true

          echo "🐳 Docker: $(docker --version 2>/dev/null || echo 'not available')"
          echo "🦦 Podman: $(podman --version 2>/dev/null || echo 'not available')"
          echo "🔒 AppArmor: $(aa-status --version 2>/dev/null || echo 'installed')"
          echo "⚡ pigz: $(pigz --version 2>/dev/null | head -1 || echo 'installed')"

      - name: Detect Container Runtime
        id: runtime
        run: |
          if command -v docker &> /dev/null; then
            echo "runtime=docker" >> $GITHUB_OUTPUT
            echo "compose=docker compose" >> $GITHUB_OUTPUT
            echo "✅ Using Docker (podman-docker symlink)"
          elif command -v podman &> /dev/null; then
            echo "runtime=podman" >> $GITHUB_OUTPUT
            echo "compose=podman-compose" >> $GITHUB_OUTPUT
            echo "✅ Using Podman"
          else
            echo "❌ No container runtime available"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: listpkgs.nuros.front-end/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (TypeScript)
        run: pnpm lint:ts

      - name: Run Stylelint (SCSS)
        run: pnpm lint:scss

      - name: Create lint summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Lint Results

          - **Runtime**: ${{ steps.runtime.outputs.runtime }}
          - **ESLint**: ✅ Passed
          - **Stylelint**: ✅ Passed
          EOF
