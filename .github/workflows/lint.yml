# =============================================================================
# Lint Frontend Workflow
# =============================================================================
# Runs ESLint and Stylelint on code changes.
# Executes in a lightweight Podman container (lint_frontend.Dockerfile).
#
# Runs on push to main branch.
# CI/CD pipeline checks this workflow status before proceeding.
# For PR tests, see pr.yml (includes lint + security + build + playwright).
# =============================================================================

name: Lint Frontend

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Podman and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              podman-docker \
              python3-pip \
              pigz \
              slirp4netns
          pip3 install podman-compose --break-system-packages

          echo "✅ Podman: $(podman --version)"
          echo "✅ pigz: $(pigz --version | head -1)"
          echo "✅ slirp4netns: $(slirp4netns --version 2>/dev/null || echo 'installed')"

      - name: Run ESLint + Stylelint in container
        run: |
          podman-compose --profile ci build --no-cache lint
          podman-compose --profile ci run --rm lint

      - name: Create lint summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔍 Lint Results

          | Check | Status |
          |-------|--------|
          | ESLint (TypeScript) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Stylelint (SCSS) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |

          **Container**: docker/lint_frontend.Dockerfile
          EOF
