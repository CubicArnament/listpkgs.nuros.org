# =============================================================================
# Lint Frontend Workflow
# =============================================================================
# Runs ESLint and Stylelint on every push and pull request.
# Executes in a lightweight Docker container (lint_frontend.Dockerfile).
# =============================================================================

name: Lint Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Docker (Podman compatibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              podman \
              podman-docker || true

      - name: Detect Container Runtime
        id: runtime
        run: |
          if command -v docker &> /dev/null; then
            echo "compose=docker compose" >> $GITHUB_OUTPUT
          elif command -v podman &> /dev/null; then
            echo "compose=podman-compose" >> $GITHUB_OUTPUT
          else
            echo "❌ No container runtime available"
            exit 1
          fi

      - name: Run ESLint + Stylelint in container
        run: |
          ${{ steps.runtime.outputs.compose }} --profile ci run --rm lint

      - name: Create lint summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔍 Lint Results

          | Check | Status |
          |-------|--------|
          | ESLint (TypeScript) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Stylelint (SCSS) | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |

          **Container**: docker/lint_frontend.Dockerfile
          EOF
