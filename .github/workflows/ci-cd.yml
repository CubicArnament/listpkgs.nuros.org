# =============================================================================
# CI/CD Pipeline - Main Workflow
# =============================================================================
# This workflow orchestrates the entire CI/CD pipeline:
# 1. Update package list (generate repodata.json)
# 2. Build frontend
# 3. Run tests
# 4. Deploy to GitHub Pages
#
# Triggered by:
# - Schedule (every 6 hours)
# - Manual dispatch
# - Push to main branch
#
# Compatible with both Docker and Podman runtimes.
# Uses slirp4netns for rootless networking (Podman).
# Uses AppArmor for container security.
# Uses pigz for fast image decompression.
# =============================================================================

name: CI/CD Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-cd-pipeline
  cancel-in-progress: false

env:
  ORG_NAME: NurOS-Packages
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Check Lint Status
  # -------------------------------------------------------------------------
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint-passed: ${{ steps.check.outputs.passed }}

    steps:
      - name: Check lint status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LINT_RESULT=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow "Lint Frontend" \
            -s success \
            --limit 1 \
            --json conclusion \
            -q '.[0].conclusion // "unknown"')

          if [ "$LINT_RESULT" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------------------
  # Job 2: Update Package List
  # -------------------------------------------------------------------------
  update-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check-lint
    if: needs.check-lint.outputs.lint-passed == 'true'

    outputs:
      package_count: ${{ steps.generate.outputs.package_count }}
      changes_detected: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Container Runtimes + Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              docker.io \
              docker-compose \
              podman \
              podman-docker \
              slirp4netns \
              apparmor \
              apparmor-utils \
              pigz
          
          # Detect runtime
          if docker info &> /dev/null; then
            echo "RUNTIME=docker" >> $GITHUB_ENV
            echo "COMPOSE_CMD=docker compose" >> $GITHUB_ENV
          elif podman info &> /dev/null; then
            echo "RUNTIME=podman" >> $GITHUB_ENV
            echo "COMPOSE_CMD=podman-compose" >> $GITHUB_ENV
          fi

      - name: Run update-list service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm update-list

      - name: Generate package count
        id: generate
        run: |
          if [ -f listpkgs.nuros.front-end/public/repodata.json ]; then
            COUNT=$(jq 'length' listpkgs.nuros.front-end/public/repodata.json 2>/dev/null || echo "0")
            echo "package_count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "package_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet listpkgs.nuros.front-end/public/repodata.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin
          git reset --hard origin/main
          git add listpkgs.nuros.front-end/public/repodata.json
          git add listpkgs.nuros.front-end/public/repodata.json.sha256
          git commit -m "chore: update repodata (${{ steps.generate.outputs.package_count }} packages)" || exit 0
          git push origin main || echo "No changes to push"

      - name: Upload repodata artifact
        uses: actions/upload-artifact@v4
        with:
          name: repodata-json
          path: |
            listpkgs.nuros.front-end/public/repodata.json
            listpkgs.nuros.front-end/public/repodata.json.sha256
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 3: Build Frontend
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-lint, update-list]
    if: needs.check-lint.outputs.lint-passed == 'true'

    outputs:
      build_success: ${{ steps.build.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download repodata artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: repodata-json
          path: listpkgs.nuros.front-end/public/

      - name: Install Container Runtimes + Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              docker.io \
              docker-compose \
              podman \
              podman-docker \
              slirp4netns \
              apparmor \
              apparmor-utils \
              pigz
          
          if docker info &> /dev/null; then
            echo "RUNTIME=docker" >> $GITHUB_ENV
            echo "COMPOSE_CMD=docker compose" >> $GITHUB_ENV
          elif podman info &> /dev/null; then
            echo "RUNTIME=podman" >> $GITHUB_ENV
            echo "COMPOSE_CMD=podman-compose" >> $GITHUB_ENV
          fi

      - name: Build frontend
        id: build
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml build build
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm build
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Verify build artifacts
        run: |
          ls -lh listpkgs.nuros.front-end/dist/ | head -20
          [ -f "listpkgs.nuros.front-end/dist/index.html" ] || exit 1
          [ -f "listpkgs.nuros.front-end/dist/repodata.json" ] || \
            cp listpkgs.nuros.front-end/public/repodata.json listpkgs.nuros.front-end/dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: listpkgs.nuros.front-end/dist/
          retention-days: 7
          compression-level: 9

  # -------------------------------------------------------------------------
  # Job 4: Run Tests
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: needs.build.outputs.build_success == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: listpkgs.nuros.front-end/dist/

      - name: Install Container Runtimes + Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              docker.io \
              docker-compose \
              podman \
              podman-docker \
              slirp4netns \
              apparmor \
              apparmor-utils \
              pigz
          
          if docker info &> /dev/null; then
            echo "COMPOSE_CMD=docker compose" >> $GITHUB_ENV
          elif podman info &> /dev/null; then
            echo "COMPOSE_CMD=podman-compose" >> $GITHUB_ENV
          fi

      - name: Run tests
        run: |
          $COMPOSE_CMD -f docker-compose.ci.yml build test
          $COMPOSE_CMD -f docker-compose.ci.yml run --rm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: listpkgs.nuros.front-end/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 5: Deploy to GitHub Pages
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [update-list, build, test]
    if: |
      always() &&
      needs.update-list.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Verify deployment contents
        run: |
          ls -lh dist/ | head -20
          [ -f "dist/index.html" ] || exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 GitHub Pages Deployment

          | Metric | Value |
          |--------|-------|
          | **Status** | ${{ job.status }} |
          | **URL** | ${{ steps.deployment.outputs.page_url }} |
          | **Packages** | ${{ needs.update-list.outputs.package_count }} |
          | **Triggered by** | \`${{ github.event_name }}\` |

          ### Job Results
          - Lint Check: ${{ needs.check-lint.result }}
          - Update List: ${{ needs.update-list.result }}
          - Build: ${{ needs.build.result }}
          - Tests: ${{ needs.test.result }}
          - Deploy: ${{ job.status }}
          EOF
