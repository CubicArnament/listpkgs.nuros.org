# =============================================================================
# CI/CD Pipeline - Main Workflow
# =============================================================================
# Full CI/CD pipeline with scheduled runs every 6 hours.
# Checks lint.yml status before proceeding.
# All jobs run in Podman containers.
#
# Triggered by:
# - Manual dispatch
# - Scheduled cron (every 6 hours)
#
# Note: Does NOT run on push/PR - those are handled by lint.yml and pr.yml
# =============================================================================

name: CI/CD Pipeline

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-cd-pipeline
  cancel-in-progress: false

env:
  ORG_NAME: NurOS-Packages
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Check Lint Status
  # -------------------------------------------------------------------------
  # Checks if the last lint.yml run was successful.
  # Does NOT trigger lint.yml - just reads the last result.
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint-passed: ${{ steps.check.outputs.passed }}

    steps:
      - name: Check lint status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LINT_RESULT=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow "Lint Frontend" \
            -s success \
            --limit 1 \
            --json conclusion \
            -q '.[0].conclusion // "unknown"')

          if [ "$LINT_RESULT" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log lint status
        run: |
          echo "Last lint.yml result: ${{ steps.check.outputs.passed }}"

  # -------------------------------------------------------------------------
  # Job 2: Update Package List
  # -------------------------------------------------------------------------
  update-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check-lint
    if: needs.check-lint.outputs.lint-passed == 'true'

    outputs:
      package_count: ${{ steps.generate.outputs.package_count }}
      changes_detected: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Run update-list service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman-compose --profile ci run --rm update-list

      - name: Generate package count
        id: generate
        run: |
          if [ -f listpkgs.nuros.front-end/public/repodata.json ]; then
            COUNT=$(jq 'length' listpkgs.nuros.front-end/public/repodata.json 2>/dev/null || echo "0")
            echo "package_count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "package_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet listpkgs.nuros.front-end/public/repodata.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin
          git reset --hard origin/main
          git add listpkgs.nuros.front-end/public/repodata.json
          git add listpkgs.nuros.front-end/public/repodata.json.sha256
          git commit -m "chore: update repodata (${{ steps.generate.outputs.package_count }} packages)" || exit 0
          git push origin main || echo "No changes to push"

      - name: Upload repodata artifact
        uses: actions/upload-artifact@v4
        with:
          name: repodata-json
          path: |
            listpkgs.nuros.front-end/public/repodata.json
            listpkgs.nuros.front-end/public/repodata.json.sha256
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 3: Build Frontend
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-lint, update-list]
    if: needs.check-lint.outputs.lint-passed == 'true'

    outputs:
      build_success: ${{ steps.build.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download repodata artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: repodata-json
          path: listpkgs.nuros.front-end/public/

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Build frontend in container
        id: build
        run: |
          podman-compose --profile ci run --rm build
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Verify build artifacts
        run: |
          ls -lh listpkgs.nuros.front-end/dist/ | head -20
          [ -f "listpkgs.nuros.front-end/dist/index.html" ] || exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: listpkgs.nuros.front-end/dist/
          retention-days: 7
          compression-level: 9

  # -------------------------------------------------------------------------
  # Job 4: Run Tests
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-lint, build]
    if: needs.check-lint.outputs.lint-passed == 'true' && needs.build.outputs.build_success == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: listpkgs.nuros.front-end/dist/

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-docker python3-pip
          pip3 install podman-compose --break-system-packages

      - name: Run tests in container
        run: |
          podman-compose --profile ci run --rm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: listpkgs.nuros.front-end/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 5: Deploy to GitHub Pages
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-lint, update-list, build, test]
    if: |
      always() &&
      needs.check-lint.result == 'success' &&
      needs.update-list.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Verify deployment contents
        run: |
          ls -lh dist/ | head -20
          [ -f "dist/index.html" ] || exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 CI/CD Pipeline Results

          | Metric | Value |
          |--------|-------|
          | **Status** | ${{ job.status }} |
          | **URL** | ${{ steps.deployment.outputs.page_url }} |
          | **Packages** | ${{ needs.update-list.outputs.package_count }} |
          | **Triggered by** | \`${{ github.event_name }}\` |

          ### Job Results
          - Lint Check: ${{ needs.check-lint.result }}
          - Update List: ${{ needs.update-list.result }}
          - Build: ${{ needs.build.result }}
          - Tests: ${{ needs.test.result }}
          - Deploy: ${{ job.status }}
          EOF
