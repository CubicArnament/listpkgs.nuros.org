# =============================================================================
# Docker Compose for CI/CD - Microservices Architecture
# =============================================================================
# This file defines services for CI/CD pipeline.
# Compatible with both Docker and Podman.
#
# Security features:
# - AppArmor strict profile for container isolation
# - no-new-privileges to prevent privilege escalation
# - slirp4netns for rootless networking (Podman)
# - Read-only root filesystem where possible
#
# Usage:
#   docker compose -f docker-compose.ci.yml run --rm <service>
#   podman-compose -f docker-compose.ci.yml run --rm <service>
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Service: Update Package List
  # -------------------------------------------------------------------------
  update-list:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ../.ci:/app/.ci:ro
      - ../listpkgs.nuros.front-end/public:/app/output
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # slirp4netns for rootless networking (Podman)
      - PODMAN_NETWORK_CMD=slirp4netns
    command: >
      sh -c "
        cd /app/.ci &&
        listpkgs-aggregate &&
        cp repodata.json /app/output/ &&
        sha256sum repodata.json > /app/output/repodata.json.sha256
      "
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # -------------------------------------------------------------------------
  # Service: Lint Frontend
  # -------------------------------------------------------------------------
  lint:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: deps
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ../listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end:ro
    command: sh -c "pnpm install --frozen-lockfile && pnpm lint:ts && pnpm lint:scss"
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /root/.npm
      - /root/.cache

  # -------------------------------------------------------------------------
  # Service: Build Frontend
  # -------------------------------------------------------------------------
  build:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: builder
    volumes:
      - ../listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
      - ../listpkgs.nuros.front-end/public:/app/listpkgs.nuros.front-end/public
    environment:
      - NODE_ENV=production
      - PODMAN_NETWORK_CMD=slirp4netns
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # -------------------------------------------------------------------------
  # Service: Test Frontend
  # -------------------------------------------------------------------------
  test:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: test
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ../listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end:ro
      - ../listpkgs.nuros.front-end/public:/app/listpkgs.nuros.front-end/public
    environment:
      - CI=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PODMAN_NETWORK_CMD=slirp4netns
    command: pnpm test
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /ms-playwright

  # -------------------------------------------------------------------------
  # Service: Preview Production Build
  # -------------------------------------------------------------------------
  preview:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "8080:80"
    depends_on:
      - build
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx

  # -------------------------------------------------------------------------
  # Service: Development
  # -------------------------------------------------------------------------
  dev:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: dev
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ../listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - VITE_DEV_SERVER=true
      - PODMAN_NETWORK_CMD=slirp4netns
    security_opt:
      - apparmor=container-nuros-strict
      - no-new-privileges:true

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  node_modules:
