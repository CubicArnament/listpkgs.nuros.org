# =============================================================================
# Docker Compose - Production & Development
# =============================================================================
# Main docker-compose file for local development and production deployment.
# Supports both Docker and Podman.
#
# Usage:
#   Development:  docker-compose up dev
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#   CI/CD:        docker-compose -f docker-compose.ci.yml up <service>
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Service: Frontend Production (nginx)
  # Serves the built frontend application
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "80:80"
    volumes:
      - ./listpkgs.nuros.front-end/public:/usr/share/nginx/html
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nuros-network

  # -------------------------------------------------------------------------
  # Service: Backend (Python for listpkgs-aggregator)
  # Provides Python environment for package list generation
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ./.ci:/app/.ci
      - ./listpkgs.nuros.front-end/public:/app/output
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    networks:
      - nuros-network

  # -------------------------------------------------------------------------
  # Service: Development Server
  # Vite development server with hot reload
  # -------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ./listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
      - node_modules:/app/listpkgs.nuros.front-end/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - VITE_DEV_SERVER=true
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    profiles:
      - development
    networks:
      - nuros-network

  # -------------------------------------------------------------------------
  # Service: Test Runner
  # Runs Playwright tests in headless mode
  # -------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: test
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ./listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
      - ./listpkgs.nuros.front-end/public:/app/listpkgs.nuros.front-end/public
      - playwright-cache:/ms-playwright
    environment:
      - CI=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    command: ["pnpm", "test"]
    profiles:
      - test
    networks:
      - nuros-network

  # -------------------------------------------------------------------------
  # Service: Lint Runner
  # Runs ESLint and Stylelint
  # -------------------------------------------------------------------------
  lint:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: deps
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ./listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
    command: >
      sh -c "
        pnpm install --frozen-lockfile &&
        pnpm lint:ts &&
        pnpm lint:scss
      "
    profiles:
      - development
      - test
    networks:
      - nuros-network

# =============================================================================
# Networks
# =============================================================================
networks:
  nuros-network:
    driver: bridge
    name: nuros-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  node_modules:
    name: nuros-node-modules
  playwright-cache:
    name: nuros-playwright-cache
