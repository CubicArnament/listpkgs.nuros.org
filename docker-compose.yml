# =============================================================================
# Docker Compose - Main Configuration
# =============================================================================
# Unified docker-compose file for development, preview, and CI/CD.
# Uses profiles to separate environments.
#
# Usage:
#   Development:  docker compose up dev
#   Preview:      docker compose --profile preview up preview
#   CI/CD:        docker compose --profile ci run --rm <service>
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Service: Development Server (Vite with hot reload)
  # Profile: development (default)
  # -------------------------------------------------------------------------
  dev:
    image: node:22-alpine
    container_name: nuros-dev
    working_dir: /app/listpkgs.nuros.front-end
    volumes:
      - ./listpkgs.nuros.front-end:/app/listpkgs.nuros.front-end
      - node_modules:/app/listpkgs.nuros.front-end/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - VITE_DEV_SERVER=true
    command: ["sh", "-c", "apk add --no-cache pnpm && corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"]
    profiles:
      - development
      - ""
    networks:
      - nuros-network

  # -------------------------------------------------------------------------
  # Service: Preview Production Build (nginx)
  # Profile: preview
  # -------------------------------------------------------------------------
  preview:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: preview
    container_name: nuros-preview
    ports:
      - "8080:80"
    depends_on:
      build:
        condition: service_completed_successfully
    profiles:
      - preview
    networks:
      - nuros-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------------------
  # Service: Build Frontend (Production build)
  # Profile: preview, ci
  # -------------------------------------------------------------------------
  build:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: builder
    container_name: nuros-build
    volumes:
      - build_dist:/app/listpkgs.nuros.front-end/dist
    environment:
      - NODE_ENV=production
      - CI=true
    profiles:
      - preview
      - ci
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Lint Frontend (ESLint + Stylelint)
  # Profile: ci
  # -------------------------------------------------------------------------
  lint:
    build:
      context: .
      dockerfile: docker/lint_frontend.Dockerfile
    container_name: nuros-lint
    environment:
      - CI=true
    command: ["sh", "-c", "pnpm lint"]
    profiles:
      - ci
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Test Frontend (Playwright E2E)
  # Profile: ci
  # -------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: docker/tests_frontend.Dockerfile
    container_name: nuros-test
    volumes:
      - playwright_cache:/ms-playwright
    environment:
      - CI=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    command: ["pnpm", "test"]
    profiles:
      - ci
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Update Package List (Python backend)
  # Profile: ci
  # -------------------------------------------------------------------------
  update-list:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: nuros-update-list
    volumes:
      - ./listpkgs.nuros.front-end/public:/app/output
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: >
      sh -c "
        cd /app/.ci &&
        listpkgs-aggregate &&
        cp repodata.json /app/output/ &&
        sha256sum repodata.json > /app/output/repodata.json.sha256
      "
    profiles:
      - ci
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Generate repodata.json (for preview)
  # Profile: preview
  # -------------------------------------------------------------------------
  generate-repodata:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: nuros-generate-repodata
    volumes:
      - ./listpkgs.nuros.front-end/public:/app/output
    command: >
      sh -c "
        cd /app/.ci &&
        listpkgs-aggregate &&
        cp repodata.json /app/output/ &&
        sha256sum repodata.json > /app/output/repodata.json.sha256
      "
    profiles:
      - preview
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Format Code (Python + Frontend)
  # Profile: ci, development
  # -------------------------------------------------------------------------
  format:
    build:
      context: .
      dockerfile: docker/formatter.Dockerfile
    container_name: nuros-format
    volumes:
      - .:/workspace
    working_dir: /workspace/listpkgs.nuros.front-end
    environment:
      - CI=true
    command: >
      sh -c "
        echo '🔧 Formatting Python code...' &&
        cd /workspace &&
        black --config .ci/pyproject.toml .ci/ &&
        isort .ci/ &&
        echo '🎨 Formatting frontend code...' &&
        cd /workspace/listpkgs.nuros.front-end &&
        pnpx prettier --write 'src/**/*.{ts,tsx,css,scss}' &&
        echo '✅ Formatting complete!'
      "
    profiles:
      - ci
      - development
    networks:
      - nuros-network
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Service: Preview Init (generate repodata + build + start preview)
  # Helper service that shows instructions for running preview locally
  # Profile: preview
  # -------------------------------------------------------------------------
  # Note: This service shows how to run preview locally.
  # For automated preview, use the individual services:
  #   1. docker compose --profile preview run --rm generate-repodata
  #   2. docker compose --profile preview up --build preview
  # -------------------------------------------------------------------------
  preview-init:
    image: alpine:latest
    container_name: nuros-preview-init
    command: >
      sh -c "
        echo '========================================'
        echo '  NurOS Preview - Manual Steps'
        echo '========================================'
        echo ''
        echo 'Run these commands on your host:'
        echo ''
        echo '  # Step 1: Generate repodata.json'
        echo '  docker compose --profile preview run --rm generate-repodata'
        echo ''
        echo '  # Step 2: Build and start preview'
        echo '  docker compose --profile preview up --build preview'
        echo ''
        echo 'Or use podman:'
        echo ''
        echo '  podman-compose --profile preview run --rm generate-repodata'
        echo '  podman-compose --profile preview up --build preview'
        echo ''
        echo '========================================'
      "
    profiles:
      - preview
    network_mode: host

# =============================================================================
# Networks
# =============================================================================
networks:
  nuros-network:
    driver: bridge
    name: nuros-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  build_dist:
    name: nuros-build-dist
  playwright_cache:
    name: nuros-playwright-cache
  node_modules:
    name: nuros-node-modules
