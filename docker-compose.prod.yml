version: '3.9'

services:
  # Production application container
  nuros-app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: nuros-listpkgs:latest
    container_name: nuros-prod
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      # Logs (mount only for monitoring)
      - ./logs/production:/var/log:rw
      # Config files (if needed)
      - ./config/prod:/app/config:ro
    ports:
      # Only expose API port (uses reverse proxy in front)
      - "3000:3000"
    networks:
      - nuros-prod
    restart: unless-stopped
    # Security options
    security_opt:
      # Enable AppArmor strict profile for container isolation
      - apparmor=container-nuros-strict
      # Prevent privilege escalation
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    # Health checks
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          "curl -f http://localhost:3000/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service=nuros-app'
    # Read-only root filesystem for security
    read_only: true
    tmpfs:
      - /tmp
      - /run

  # Production reverse proxy (Nginx/Traefik)
  # Configure external reverse proxy or load balancer
  # Example with nginx-proxy:
  # nginx-proxy:
  #   image: nginxproxy/nginx-proxy:latest
  #   container_name: nuros-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/production/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - nuros-prod
  #   restart: unless-stopped

  # Production monitoring (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: nuros-monitoring
  #   volumes:
  #     - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - nuros-prod
  #   restart: unless-stopped
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'

  # Optional: Database in production (separate service or managed)
  # postgres-prod:
  #   image: postgres:16-alpine
  #   container_name: nuros-db-prod
  #   environment:
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_NAME}
  #   volumes:
  #     - postgres_data_prod:/var/lib/postgresql/data
  #   networks:
  #     - nuros-prod
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  nuros-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

volumes:
  # postgres_data_prod:
  # prometheus_data:
