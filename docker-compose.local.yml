version: '3.9'

services:
  # Local development environment with hot reload
  nuros-dev:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: nuros-dev-local
    environment:
      NODE_ENV: development
      PNPM_HOME: /root/.pnpm
      PATH: /root/.pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # Mount entire workspace
      - .:/workspace
      - /workspace/node_modules  # Named volume for node_modules
      - /workspace/listpkgs.nuros.front-end/node_modules
      - /workspace/blog/node_modules
      # Nginx config
      - ./docker/local/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/local/supervisord.conf:/workspace/docker/local/supervisord.conf:ro
      # Logs
      - ./logs/local:/var/log:rw
    ports:
      # Main development server (port 80 -> nginx reverse proxy)
      - "80:80"
      # Direct dev server access (if needed)
      - "5173:5173"
      - "5174:5174"
      # Backend API (if needed)
      - "3000:3000"
    networks:
      - nuros-local
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stdin_open: true
    tty: true
    # Don't limit resources for development
    # So developers can test performance issues

  # Optional: PostgreSQL for local database
