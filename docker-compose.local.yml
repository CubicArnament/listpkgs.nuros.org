  #     - nuros-local
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U nuros']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Redis for caching
  # redis-local:
  #   image: redis:7-alpine
  #   container_name: nuros-redis-local
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - nuros-local
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
