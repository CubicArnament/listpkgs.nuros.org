# Это файл конфигурации для pnpm workspace
# Он указывает pnpm, какие пакеты включать в workspace

packages:
  - '.'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
overrides:
  ajv@<6.14.0: '>=6.14.0'
  flatted@<3.4.0: '>=3.4.0'
  immutable@>=5.0.0 <5.1.5: '>=5.1.5'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
