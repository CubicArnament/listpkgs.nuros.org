# WASM Hardware Detector - Go Linting Configuration
# https://golangci-lint.run/

run:
  timeout: 5m
  tests: false

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - nakedret
    - unconvert

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: listpkgs.nuros.org
  misspell:
    locale: US
  nakedret:
    max-func-lines: 30

issues:
  exclude-use-default: false
  exclude-rules:
    # Исключить проверки для WASM специфики
    - path: _test\.go
      linters:
        - errcheck

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
